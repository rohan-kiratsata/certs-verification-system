services:
  mysql:
    image: mysql:8.4
    container_name: fueler-mysql
    restart: unless-stopped
    ports:
      - '3306:3306'
    environment:
      MYSQL_DATABASE: fueler
      MYSQL_USER: fueler
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-psecret']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
